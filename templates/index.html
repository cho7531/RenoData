<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>등기부등본 자동 추출</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <header>
    <h1>등기부등본 → 엑셀 자동 추출</h1>
    <p class="subtitle">등기부등본 PDF를 업로드하면 지번, 면적, 소유자 정보를 자동으로 추출하여 엑셀로 만들어드립니다.</p>
  </header>

  <section id="dropzone" class="dropzone">
    <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
    <div class="dropzone-inner">
      <div class="dropzone-icon">📄</div>
      <p><strong>클릭하여 파일 선택</strong> 또는 여기로 드래그하세요</p>
      <p class="hint">PDF 파일만 지원 · 파일당 최대 10MB · 최대 50개</p>
    </div>
  </section>

  <section id="fileListSection" class="hidden">
    <h2>업로드된 파일 (<span id="fileCount">0</span>)</h2>
    <ul id="fileList" class="file-list"></ul>
    <div class="actions">
      <button id="extractBtn" class="btn btn-primary">정보 추출</button>
      <button id="clearBtn" class="btn btn-secondary">전체 삭제</button>
    </div>
  </section>

  <section id="statusSection" class="hidden">
    <div class="spinner"></div>
    <p id="statusText">추출 중입니다...</p>
  </section>

  <section id="errorSection" class="hidden">
    <h2 class="error-title">처리하지 못한 파일</h2>
    <ul id="errorList" class="error-list"></ul>
  </section>

  <section id="resultSection" class="hidden">
    <div class="result-header">
      <h2>추출 결과 (<span id="rowCount">0</span>건)</h2>
      <div class="result-actions">
        <button id="addRowBtn" class="btn btn-secondary">행 추가</button>
        <button id="resetResultsBtn" class="btn btn-secondary">결과 초기화</button>
        <button id="downloadBtn" class="btn btn-primary">엑셀 다운로드</button>
      </div>
    </div>
    <p class="hint">셀을 클릭하면 직접 값을 수정할 수 있습니다. 검수 후 다운로드하세요.</p>
    <div class="table-wrap">
      <table id="resultTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
